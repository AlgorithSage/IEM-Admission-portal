<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-box">
    <div class="modal-header">
      <img src="assets/iem-logo.png" alt="IEM Logo" class="modal-iem-logo">
      <h2>Sign In</h2>
      <p>Choose how you want to sign in</p>
      <button class="close-btn" (click)="close.emit()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="pathway-options">
      <!-- Applicant Portal Option -->
      <div class="pathway-card applicant-card" (click)="selectPathway('applicant')">
        <div class="card-icon">
          <i class="fa-solid fa-user-graduate"></i>
        </div>
        <div class="card-content">
                    <h3>Applicant</h3>
          <p>Register, fill the admission form, pay the fee and track your application.</p>
        </div>
        <div class="card-arrow">
          <i class="fa-solid fa-arrow-right"></i>
        </div>
      </div>

      <!-- Administrator Portal Option -->
      <div class="pathway-card admin-card" (click)="selectPathway('admin')">
        <div class="card-icon admin-icon">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <div class="card-content">
                    <h3>Admission Staff</h3>
          <p>Review applications, verify documents and record decisions.</p>
        </div>
        <div class="card-arrow">
          <i class="fa-solid fa-arrow-right"></i>
        </div>
      </div>
    </div>
  </div>
</div>
